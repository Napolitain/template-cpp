minimum_prek_version = "0.5.0"
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "fix-byte-order-marker" },
    { id = "pretty-format-json", args = ["--autofix", "--no-sort-keys", "--indent", "4"] },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
]

[[repos]]
repo = "local"

# pre-commit

[[repos.hooks]]
id = "clang-format"
name = "clang-format"
language = "system"
entry = "clang-format -i"
types_or = ["c++", "c"]
stages = ["pre-commit"]

# pre-push: tidy/cppcheck/coverage/mutation are CMake targets (see CMakeLists.txt, CMakePresets.json)

[[repos.hooks]]
id = "lint"
name = "clang-tidy --fix + cppcheck"
language = "system"
entry = "cmake --workflow --preset lint"
types_or = ["c++", "c", "cmake"]
pass_filenames = false
stages = ["pre-push"]
priority = 10

[[repos.hooks]]
id = "test-coverage"
name = "ctest + coverage (min 80% lines)"
language = "system"
entry = "cmake --workflow --preset coverage"
types_or = ["c++", "c", "cmake"]
pass_filenames = false
stages = ["pre-push"]
priority = 20

# manual: prek run --hook-stage manual mull --all-files (needs Mull for your clang major, see README)

[[repos.hooks]]
id = "mull"
name = "mull (mutation testing)"
language = "system"
entry = "cmake --workflow --preset mutation"
types_or = ["c++", "c", "cmake"]
pass_filenames = false
stages = ["manual"]
