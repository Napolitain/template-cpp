minimum_prek_version = "0.5.0"
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "fix-byte-order-marker" },
    { id = "pretty-format-json", args = ["--autofix", "--no-sort-keys", "--indent", "4"] },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
]

[[repos]]
repo = "local"

# pre-commit

[[repos.hooks]]
id = "clang-format"
name = "clang-format"
language = "system"
entry = "clang-format -i"
types_or = ["c++", "c"]
stages = ["pre-commit"]

# pre-push (both need build/debug/compile_commands.json, so configure first)

[[repos.hooks]]
id = "clang-tidy"
name = "clang-tidy"
language = "system"
entry = "sh -c 'cmake --preset debug >/dev/null && clang-tidy -p build/debug --fix --fix-notes --quiet \"$@\"' --"
files = '^(src|examples|tests)/.*\.cpp$'
require_serial = true
stages = ["pre-push"]
priority = 10

[[repos.hooks]]
id = "cppcheck"
name = "cppcheck"
language = "system"
entry = "sh -c 'cmake --preset debug >/dev/null && cppcheck --project=build/debug/compile_commands.json -ibuild --enable=warning,style,performance,portability --inline-suppr --suppress=missingIncludeSystem --error-exitcode=1 --quiet'"
types_or = ["c++", "c"]
pass_filenames = false
stages = ["pre-push"]
priority = 20

[[repos.hooks]]
id = "test-coverage"
name = "ctest + coverage (min 80% lines)"
language = "system"
entry = "cmake --workflow --preset coverage"
types_or = ["c++", "c", "cmake"]
pass_filenames = false
stages = ["pre-push"]
priority = 30

# manual: prek run --hook-stage manual mull --all-files (needs Mull for LLVM 21, see README)

[[repos.hooks]]
id = "mull"
name = "mull (mutation testing)"
language = "system"
entry = "sh -c 'cmake --preset mutation >/dev/null && cmake --build --preset mutation && mull-runner-21 build/mutation/template_tests'"
types_or = ["c++", "c", "cmake"]
pass_filenames = false
stages = ["manual"]
